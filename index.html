<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MailCtrl - Bulk Gmail Manager</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #07080c; --surf: #0d0f17; --surf2: #12151f; --surf3: #181c28;
      --line: #1a1e2c; --line2: #22283a; --text: #c8d0de; --muted: #4a5568;
      --acc: #5b8ef0; --acc-d: rgba(91,142,240,.10); --acc-b: rgba(91,142,240,.18);
      --ok: #3ecf8e; --err: #f76c6c; --warn: #f7c86c;
      --f: 'Syne', system-ui, sans-serif; --m: 'DM Mono', monospace;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--f); font-size: 14px; overflow: hidden; height: 100vh; }
    .app { display: flex; height: 100vh; overflow: hidden; }

    /* Sidebar */
    .sb { width: 220px; min-width: 220px; background: var(--surf); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
    .logo { display: flex; align-items: center; gap: 10px; padding: 16px 14px; border-bottom: 1px solid var(--line); }
    .logo-m { width: 32px; height: 32px; background: linear-gradient(135deg, #1a3a7a, #5b8ef0); border-radius: 10px; display: grid; place-items: center; font-weight: 800; color: white; }
    .logo-t { font-weight: 700; letter-spacing: -.02em; }
    .logo-s { font-size: 9px; font-family: var(--m); color: var(--muted); }
    .nav { flex: 1; overflow-y: auto; padding: 12px 8px; display: flex; flex-direction: column; gap: 2px; }
    .nav-sec { font-size: 9px; font-family: var(--m); color: var(--muted); letter-spacing: 1px; padding: 8px 8px 4px; }
    .nb { display: flex; align-items: center; gap: 8px; background: transparent; border: none; border-radius: 8px; padding: 8px 8px; color: var(--muted); font-family: var(--f); font-size: 13px; cursor: pointer; text-align: left; width: 100%; }
    .nb .ni { font-family: var(--m); width: 20px; opacity: 0.7; }
    .nb .nl { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .nb:hover { background: var(--surf2); color: var(--text); }
    .nb.act { background: var(--acc-d); color: var(--acc); font-weight: 600; }
    .nb-x { opacity: 0; font-size: 11px; transition: 0.1s; background: none; border: none; color: var(--muted); cursor: pointer; padding: 0 4px; }
    .nb:hover .nb-x { opacity: 0.7; }
    .nb-x:hover { color: var(--err) !important; }
    .ff { background: var(--surf2); border: 1px solid var(--line2); border-radius: 10px; padding: 8px; margin: 4px; display: flex; flex-direction: column; gap: 6px; }
    .ff input { background: var(--surf); border: 1px solid var(--line2); border-radius: 6px; padding: 6px 8px; color: var(--text); font-family: var(--m); font-size: 12px; width: 100%; }
    .ff-btns { display: flex; gap: 6px; }
    .ff-btns button { flex: 1; background: transparent; border: 1px solid var(--line2); border-radius: 6px; padding: 5px; color: var(--muted); cursor: pointer; }
    .ff-save { background: var(--acc-d) !important; border-color: var(--acc) !important; color: var(--acc) !important; }
    .sb-foot { padding: 12px; border-top: 1px solid var(--line); display: flex; justify-content: space-between; align-items: center; }
    .pill { font-size: 9px; font-family: var(--m); background: #0d1d33; padding: 3px 8px; border-radius: 20px; color: var(--acc); }
    .sign-out { background: none; border: none; color: var(--muted); font-family: var(--m); font-size: 11px; cursor: pointer; }

    /* Main area */
    .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
    .tbar { display: flex; gap: 12px; padding: 12px 16px; background: var(--surf); border-bottom: 1px solid var(--line); align-items: center; }
    .sw { flex: 1; display: flex; align-items: center; gap: 8px; background: var(--surf2); border: 1px solid var(--line2); border-radius: 40px; padding: 6px 14px; }
    .sw-inp { background: transparent; border: none; color: var(--text); width: 100%; outline: none; font-family: var(--m); }
    .tbar-lbl { font-family: var(--m); font-size: 11px; background: var(--surf2); padding: 4px 10px; border-radius: 20px; color: var(--acc); }
    
    /* Action bar */
    .abar { display: none; align-items: center; gap: 8px; padding: 8px 16px; background: #0a0f1e; border-bottom: 1px solid #1a2a4a; flex-wrap: wrap; }
    .abar.show { display: flex; }
    .sel-n { background: var(--acc-d); padding: 3px 8px; border-radius: 20px; font-size: 11px; font-family: var(--m); color: var(--acc); }
    .ab { padding: 5px 14px; border-radius: 20px; font-size: 12px; font-weight: 600; border: 1px solid; cursor: pointer; background: var(--surf2); transition: 0.1s; }
    .ab-arch { border-color: #2a402a; color: var(--ok); background: #152215; }
    .ab-read { color: var(--muted); border-color: var(--line2); }
    .ab-del { border-color: #5a2020; color: var(--err); background: #2a1515; }
    .ab-special { border-color: #5a3a08; color: var(--warn); background: #2a1e08; }
    .ab-lbl { border-color: #2d2850; color: #a78bfa; }
    .ab-x { margin-left: auto; background: transparent; border-color: var(--line2); color: var(--muted); }
    .lw { position: relative; }
    .ldrop { display: none; position: absolute; top: 100%; left: 0; background: var(--surf2); border: 1px solid var(--line2); border-radius: 12px; padding: 8px; min-width: 180px; z-index: 200; }
    .ldrop.open { display: block; }
    .li { display: block; width: 100%; padding: 6px 12px; background: transparent; border: none; color: var(--text); text-align: left; cursor: pointer; border-radius: 6px; }
    .li:hover { background: var(--surf3); }
    .lnew { display: flex; gap: 6px; margin-top: 8px; border-top: 1px solid var(--line); padding-top: 8px; }

    /* Content & email list */
    .content { display: flex; flex: 1; overflow: hidden; }
    .tlist { flex: 1; overflow-y: auto; }
    .tlist.split { width: 42%; border-right: 1px solid var(--line); }
    .lhead { display: flex; align-items: center; gap: 12px; padding: 10px 16px; background: var(--surf); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; }
    .cb { accent-color: var(--acc); width: 16px; height: 16px; cursor: pointer; }
    .lmeta { font-size: 11px; font-family: var(--m); color: var(--muted); }
    .tr { display: flex; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; transition: 0.1s; align-items: flex-start; }
    .tr:hover { background: var(--surf2); }
    .tr.sel { background: rgba(91,142,240,.08); }
    .tr.unread .tfrom, .tr.unread .tsub { font-weight: 700; color: #fff; }
    .udot { width: 6px; height: 6px; background: var(--acc); border-radius: 50%; margin-top: 5px; flex-shrink: 0; }
    .udot.h { visibility: hidden; }
    .ti { flex: 1; min-width: 0; }
    .tt { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 2px; }
    .tfrom { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tdate { font-size: 10px; font-family: var(--m); color: var(--muted); flex-shrink: 0; }
    .tsub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .tsnip { font-size: 12px; color: var(--muted); opacity: 0.6; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .trash-all-btn { background: #2a1515; border: 1px solid #5a2020; border-radius: 6px; padding: 4px 12px; color: var(--err); font-family: var(--m); font-size: 10px; margin-left: auto; cursor: pointer; }
    .load-more { margin: 16px; text-align: center; padding: 8px; background: var(--surf2); border-radius: 40px; cursor: pointer; border: 1px dashed var(--line2); font-family: var(--f); font-size: 12px; }

    /* Detail panel */
    .det { flex: 1; overflow-y: auto; padding: 24px; }
    .det-sub { font-size: 18px; font-weight: 700; margin-bottom: 16px; }
    .det-close { background: var(--surf2); border: 1px solid var(--line2); border-radius: 30px; padding: 4px 12px; cursor: pointer; }
    .unsub-bar { background: #152215; border: 1px solid var(--ok); border-radius: 12px; padding: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .mb { background: var(--surf); border-radius: 12px; padding: 16px; margin-bottom: 12px; border: 1px solid var(--line); }
    .mfrom { font-weight: 700; margin-bottom: 4px; }
    .mdate { font-size: 10px; color: var(--muted); }
    .mbody { font-size: 13px; line-height: 1.5; margin-top: 8px; white-space: pre-wrap; }
    
    /* Overlays */
    .busy { position: fixed; inset: 0; background: rgba(0,0,0,0.7); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px; z-index: 1000; }
    .busy.show { display: flex; }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #1a1f2e; border: 1px solid var(--acc); border-radius: 40px; padding: 8px 20px; font-size: 13px; z-index: 1100; display: none; }
    .toast.show { display: block; animation: fadeUp 0.2s; }
    .auth { display: none; align-items: center; justify-content: center; height: 100vh; }
    .auth.show { display: flex; }
    .auth-card { background: var(--surf); border-radius: 28px; padding: 40px; text-align: center; max-width: 420px; border: 1px solid var(--line2); }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    .spin { width: 28px; height: 28px; border: 2px solid var(--line2); border-top: 2px solid var(--acc); border-radius: 50%; animation: spin 0.7s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div id="auth-screen" class="auth">
  <div class="auth-card">
    <div class="logo-m" style="margin: 0 auto 16px;">M</div>
    <h2 style="margin-bottom: 8px;">MailCtrl</h2>
    <p style="color: var(--muted); margin-bottom: 24px;">Bulk Gmail manager — delete by sender, empty trash, and sort 20k+ emails.</p>
    <div id="auth-action"></div>
    <div class="pill" style="margin-top: 20px;">gmail.modify · full control</div>
  </div>
</div>

<div id="app-screen" class="app" style="display: none;">
  <aside class="sb">
    <div class="logo"><div class="logo-m">M</div><div><div class="logo-t">MailCtrl</div><div class="logo-s">bulk operator</div></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="sb-foot"><div class="pill">Gmail API</div><button class="sign-out" id="signout-btn">Sign out</button></div>
  </aside>
  <main class="main">
    <div class="tbar"><form class="sw" id="search-form"><span>🔍</span><input class="sw-inp" id="search-input" placeholder="from:paypal OR subject:invoice"></form><div class="tbar-lbl" id="active-label">Inbox</div></div>
    <div class="abar" id="action-bar"><span class="sel-n" id="sel-count">0</span>
      <button class="ab ab-arch" id="archive-btn">Archive</button>
      <button class="ab ab-read" id="read-btn">Mark Read</button>
      <button class="ab ab-del" id="trash-btn">Trash</button>
      <button class="ab ab-special" id="delete-sender-btn">🗑️ Delete ALL From Sender</button>
      <button class="ab ab-special" id="empty-trash-btn">🧹 Empty Trash</button>
      <div class="lw"><button class="ab ab-lbl" id="label-btn">Label ▾</button><div class="ldrop" id="label-dropdown"><div id="label-list"></div><div class="lnew"><input id="new-label-input" placeholder="New label"><button id="create-label-btn">+</button></div></div></div>
      <button class="ab ab-x" id="clear-selection">✕</button>
    </div>
    <div class="content">
      <div class="tlist" id="thread-list"><div class="state" style="text-align:center;padding:40px;"><div class="spin"></div><div>Loading threads...</div></div></div>
      <div class="det" id="detail-pane" style="display:none;"><div style="text-align:center;padding:40px;opacity:0.4;">Select an email</div></div>
    </div>
  </main>
</div>
<div class="busy" id="busy-overlay"><div class="spin"></div><div id="busy-text">Processing...</div></div>
<div class="toast" id="toast-msg"></div>

<script>
// ---------- CONFIG ----------
const CLIENT_ID = "514858431339-5v6bb7egs8cirjnp1h4fa24tso511acp.apps.googleusercontent.com";
const GEMINI_WORKER = "https://twilight-dew-e570.jacobdsiler.workers.dev";

let accessToken = null;
let threads = [];
let selectedIds = new Set();
let gmailLabels = [];
let customFilters = [];
let activeFilter = { id: "inbox", query: "in:inbox", label: "Inbox" };
let currentDetailId = null;
let PAGE_SIZE = 40;
let nextPageToken = null;

// helpers
const $ = id => document.getElementById(id);
function notify(msg, type = "info") { let t = $("toast-msg"); t.textContent = msg; t.className = `toast show`; setTimeout(() => t.classList.remove("show"), 2800); }
function setBusy(show, text = "Working...") { $("busy-overlay").classList.toggle("show", show); if (text) $("busy-text").innerText = text; }

async function gFetch(path, opts = {}) {
  const res = await fetch(`https://gmail.googleapis.com/gmail/v1/users/me/${path}`, {
    ...opts, headers: { Authorization: `Bearer ${accessToken}`, "Content-Type": "application/json", ...(opts.headers || {}) }
  });
  if (res.status === 401) throw new Error("AUTH_EXPIRED");
  if (!res.ok) throw new Error(`API error ${res.status}`);
  if (res.status === 204) return {};
  return res.json();
}

async function fetchThreads(query, pageToken = null) {
  let url = `threads?q=${encodeURIComponent(query)}&maxResults=${PAGE_SIZE}&fields=threads(id,snippet),nextPageToken`;
  if (pageToken) url += `&pageToken=${pageToken}`;
  const data = await gFetch(url);
  const threadIds = (data.threads || []).map(t => t.id);
  if (!threadIds.length) return { threads: [], nextPageToken: null };
  const detailed = await Promise.all(threadIds.map(async (tid) => {
    try {
      const meta = await gFetch(`threads/${tid}?format=metadata&metadataHeaders=Subject&metadataHeaders=From&metadataHeaders=Date`);
      const firstMsg = meta.messages?.[0];
      const headers = firstMsg?.payload?.headers || [];
      const fromRaw = headers.find(h => h.name === "From")?.value || "Unknown";
      const subject = headers.find(h => h.name === "Subject")?.value || "(no subject)";
      const dateRaw = headers.find(h => h.name === "Date")?.value;
      const unread = firstMsg?.labelIds?.includes("UNREAD") || false;
      return {
        id: tid, snippet: data.threads.find(t => t.id === tid)?.snippet || "",
        from: fromRaw.replace(/<[^>]+>/, "").trim() || fromRaw,
        fromRaw, subject, date: dateRaw ? new Date(dateRaw).toLocaleDateString() : "recent",
        unread, category: null
      };
    } catch { return null; }
  }));
  return { threads: detailed.filter(Boolean), nextPageToken: data.nextPageToken || null };
}

async function loadThreads(query, filterMeta) {
  selectedIds.clear(); currentDetailId = null; nextPageToken = null;
  activeFilter = filterMeta;
  $("active-label").innerText = filterMeta.label || filterMeta.id;
  $("detail-pane").style.display = "none";
  $("thread-list").classList.remove("split");
  $("thread-list").innerHTML = `<div class="state" style="padding:40px;text-align:center;"><div class="spin"></div><div>Loading ${filterMeta.label}...</div></div>`;
  updateActionBar();
  try {
    const res = await fetchThreads(query);
    threads = res.threads;
    nextPageToken = res.nextPageToken;
    renderThreadList();
    notify(`✅ ${threads.length} threads loaded`, "ok");
  } catch(e) { 
    if(e.message === "AUTH_EXPIRED") { logout(); return; }
    notify("Error: " + e.message, "err");
    $("thread-list").innerHTML = `<div class="state">⚠️ Failed to load</div>`;
  }
}

function renderThreadList() {
  const container = $("thread-list");
  if (!threads.length) { container.innerHTML = `<div class="state" style="padding:40px;">📭 No emails</div>`; return; }
  let html = `<div class="lhead"><input type="checkbox" class="cb" id="select-all-cb"><span class="lmeta">${threads.length} threads</span><button class="trash-all-btn" id="bulk-trash-all">🔥 Delete ALL Matching</button></div>`;
  threads.forEach(t => {
    const isSelected = selectedIds.has(t.id);
    html += `<div class="tr ${t.unread ? 'unread' : ''} ${isSelected ? 'sel' : ''}" data-id="${t.id}">
      <input type="checkbox" class="cb" ${isSelected ? 'checked' : ''}>
      <div class="udot ${t.unread ? '' : 'h'}"></div>
      <div class="ti"><div class="tt"><span class="tfrom">${escapeHtml(t.from)}</span><span class="tdate">${t.date}</span></div>
      <div class="tsub">${escapeHtml(t.subject)}</div><div class="tsnip">${escapeHtml(t.snippet.slice(0, 100))}</div></div>
    </div>`;
  });
  if (nextPageToken) html += `<button class="load-more" id="load-more-btn">Load more +</button>`;
  container.innerHTML = html;
  document.querySelectorAll(".tr").forEach(row => {
    const id = row.dataset.id;
    row.addEventListener("click", (e) => { if(e.target.type !== 'checkbox') openThreadDetail(id); });
    const cb = row.querySelector(".cb");
    if(cb) cb.addEventListener("change", (e) => { e.stopPropagation(); toggleSelect(id, cb.checked); });
  });
  const selectAll = $("#select-all-cb");
  if(selectAll) selectAll.onchange = (e) => { threads.forEach(t => toggleSelect(t.id, e.target.checked)); };
  $("#load-more-btn")?.addEventListener("click", loadMore);
  $("#bulk-trash-all")?.addEventListener("click", () => trashAllMatchingQuery());
  updateActionBar();
}

async function loadMore() {
  if (!nextPageToken) return;
  const btn = $("#load-more-btn");
  if(btn) btn.innerText = "Loading...";
  try {
    const res = await fetchThreads(activeFilter.query, nextPageToken);
    threads = [...threads, ...res.threads];
    nextPageToken = res.nextPageToken;
    renderThreadList();
  } catch(e) { notify("Load more failed", "err"); }
  if(btn) btn.innerText = "Load more +";
}

function toggleSelect(id, state) { if(state) selectedIds.add(id); else selectedIds.delete(id); renderThreadList(); }
function clearSelection() { selectedIds.clear(); renderThreadList(); }
function updateActionBar() { $("action-bar").classList.toggle("show", selectedIds.size > 0); $("#sel-count").innerText = selectedIds.size; }

async function openThreadDetail(id) {
  currentDetailId = id;
  $("thread-list").classList.add("split");
  $("detail-pane").style.display = "block";
  $("detail-pane").innerHTML = `<div style="text-align:center;padding:40px;"><div class="spin"></div><div>Loading...</div></div>`;
  try {
    const full = await gFetch(`threads/${id}?format=full`);
    const messages = (full.messages || []).map(m => {
      const h = m.payload?.headers || [];
      return { from: h.find(hh=>hh.name==="From")?.value, date: h.find(hh=>hh.name==="Date")?.value, body: extractText(m.payload) };
    });
    let unsubscribeLink = null;
    const listUnsubHeader = full.messages?.[0]?.payload?.headers?.find(h=>h.name==="List-Unsubscribe")?.value;
    if(listUnsubHeader) { const match = listUnsubHeader.match(/<(https?:[^>]+)>/); if(match) unsubscribeLink = match[1]; }
    if(!unsubscribeLink) unsubscribeLink = findUnsubInBody(full.messages?.[0]?.payload);
    let detailHtml = `<div class="det-top" style="display:flex;justify-content:space-between;"><div class="det-sub">${escapeHtml(full.messages?.[0]?.payload?.headers?.find(h=>h.name==="Subject")?.value || "No Subject")}</div><button class="det-close" id="close-detail">✕</button></div>`;
    if(unsubscribeLink) detailHtml += `<div class="unsub-bar"><span>✉️ Unsubscribe available</span><a href="${unsubscribeLink}" target="_blank" class="ab" style="background:#1d3020;color:var(--ok);padding:4px 12px;">Unsubscribe ↗</a></div>`;
    messages.forEach(m => { detailHtml += `<div class="mb"><div class="mfrom">${escapeHtml(m.from)}</div><div class="mdate">${m.date}</div><div class="mbody">${escapeHtml(m.body || "(empty)")}</div></div>`; });
    $("detail-pane").innerHTML = detailHtml;
    $("#close-detail")?.addEventListener("click", () => { $("detail-pane").style.display = "none"; $("thread-list").classList.remove("split"); currentDetailId = null; });
  } catch(e) { $("detail-pane").innerHTML = `<div style="padding:20px;">Error loading thread</div>`; }
}

function extractText(part) {
  if(part?.body?.data) return atob(part.body.data.replace(/-/g,'+').replace(/_/g,'/')).slice(0, 2000);
  if(part?.parts) for(let p of part.parts) { let t = extractText(p); if(t) return t; }
  return "";
}
function findUnsubInBody(part) {
  let text = extractText(part);
  let match = text.match(/https?:\/\/[^\s<>]*unsub[^\s<>]*/i);
  return match ? match[0] : null;
}
function escapeHtml(str) { if(!str) return ""; return str.replace(/[&<>]/g, function(m) { if(m === '&') return '&amp;'; if(m === '<') return '&lt;'; if(m === '>') return '&gt;'; return m;}); }

// ----- Bulk actions: Delete ALL from a specific sender (full mailbox search) -----
async function deleteAllFromSender() {
  if(selectedIds.size === 0) { notify("Select at least one email to extract sender", "info"); return; }
  const selectedThreads = threads.filter(t => selectedIds.has(t.id));
  const senders = [...new Set(selectedThreads.map(t => t.fromRaw.match(/<(.*)>/)?.[1] || t.fromRaw))];
  if(senders.length === 0) return;
  const confirmMsg = `⚠️ PERMANENTLY DELETE all emails from ${senders[0]}${senders.length > 1 ? ` and ${senders.length-1} others` : ""} across entire mailbox? This action is irreversible.`;
  if(!confirm(confirmMsg)) return;
  setBusy(true, `Searching & deleting all from ${senders[0]}...`);
  let totalDeleted = 0;
  for(let sender of senders.slice(0, 3)) { // limit to 3 distinct senders to avoid timeouts
    let pageToken = null;
    do {
      const query = `from:${sender}`;
      const url = `threads?q=${encodeURIComponent(query)}&maxResults=200${pageToken ? `&pageToken=${pageToken}` : ""}`;
      const data = await gFetch(url);
      const ids = (data.threads || []).map(t => t.id);
      for(let id of ids) { await gFetch(`threads/${id}/trash`, { method: "POST" }).catch(e=>console.warn); totalDeleted++; }
      pageToken = data.nextPageToken;
      setBusy(true, `Deleted ${totalDeleted} so far...`);
    } while(pageToken);
  }
  setBusy(false);
  notify(`🗑️ Trashed ${totalDeleted} threads from selected senders`, "ok");
  loadThreads(activeFilter.query, activeFilter);
}

async function emptyTrash() {
  if(!confirm("🧹 PERMANENTLY delete ALL emails in Trash? This cannot be undone.")) return;
  setBusy(true, "Emptying trash...");
  let pageToken = null, total=0;
  do {
    const data = await gFetch(`threads?q=in:trash&maxResults=200${pageToken ? `&pageToken=${pageToken}` : ""}`);
    const ids = (data.threads || []).map(t => t.id);
    for(let id of ids) { await gFetch(`threads/${id}`, { method: "DELETE" }).catch(e=>{}); total++; }
    pageToken = data.nextPageToken;
  } while(pageToken);
  setBusy(false);
  notify(`Permanently removed ${total} threads from trash.`, "ok");
  if(activeFilter.query.includes("trash")) loadThreads(activeFilter.query, activeFilter);
}

async function trashAllMatchingQuery() {
  if(!confirm(`⚠️ TRASH ALL ${threads.length}+ threads matching "${activeFilter.label}"? This operation may take time for 20k+ items.`)) return;
  setBusy(true, `Collecting all matching IDs...`);
  let allIds = [...threads.map(t=>t.id)];
  let page = nextPageToken;
  while(page) {
    const res = await fetchThreads(activeFilter.query, page);
    allIds.push(...res.threads.map(t=>t.id));
    page = res.nextPageToken;
    setBusy(true, `Found ${allIds.length} threads so far...`);
  }
  setBusy(true, `Trashing ${allIds.length} threads in bulk...`);
  let done = 0;
  for(let i=0; i<allIds.length; i+=10) {
    const batch = allIds.slice(i, i+10);
    await Promise.all(batch.map(id => gFetch(`threads/${id}/trash`, {method:"POST"}).catch(()=>{})));
    done += batch.length;
    setBusy(true, `Trashed ${done}/${allIds.length}`);
  }
  setBusy(false);
  notify(`✅ ${done} threads moved to trash.`, "ok");
  loadThreads(activeFilter.query, activeFilter);
}

// ----- Archive, read, trash selected -----
async function archiveSelected() { await batchModify([...selectedIds], [], ["INBOX"]); }
async function markReadSelected() { await batchModify([...selectedIds], [], ["UNREAD"]); }
async function trashSelected() { await batchModify([...selectedIds], "TRASH"); }
async function batchModify(ids, addLabels=[], removeLabels=[]) {
  if(!ids.length) return;
  setBusy(true, `Updating ${ids.length} items...`);
  for(let id of ids) {
    if(addLabels === "TRASH") await gFetch(`threads/${id}/trash`, {method:"POST"}).catch(()=>{});
    else await gFetch(`threads/${id}/modify`, {method:"POST", body: JSON.stringify({addLabelIds: addLabels, removeLabelIds: removeLabels})}).catch(()=>{});
  }
  clearSelection();
  loadThreads(activeFilter.query, activeFilter);
  setBusy(false);
  notify(`Completed action on ${ids.length} threads`, "ok");
}

async function applyLabel(labelName) {
  if(!selectedIds.size) return;
  setBusy(true, `Applying label "${labelName}"`);
  const lid = await ensureLabel(labelName);
  for(let id of [...selectedIds]) await gFetch(`threads/${id}/modify`, {method:"POST", body:JSON.stringify({addLabelIds:[lid]})}).catch(()=>{});
  clearSelection(); loadThreads(activeFilter.query, activeFilter); setBusy(false);
  notify(`Label added.`);
}

  let existing = gmailLabels.find(l=>l.name === name);
  if(existing) return existing.id;
  const created = await gFetch("labels", {method:"POST", body:JSON.stringify({name})});
  gmailLabels.push({id:created.id, name});
  renderLabelDropdown();
  return created.id;
}
